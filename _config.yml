# 景一的寓言城堡 · Jekyll 配置
# 使用 just-the-docs 主题

title: "景一的寓言城堡"
description: "创始人 AI 可见度与 IP 资产诊断站"
tagline: "GEO 与创始人 AI 可见度顾问"

# ===== 域名配置 =====
url: "https://fable-castle.com"
baseurl: ""

# SEO 优化
lang: zh-CN
locale: zh_CN
timezone: Asia/Shanghai

# 品牌元数据
brand:
  name: "景一 fable"
  full_name: "景一的寓言城堡"
  alternate: ["景一", "Jingyi fable", "fable-cc", "Fable Castle"]
  search_keyword: "景一的寓言城堡"
  disambiguation: "此处景一指 GEO 与创始人 AI 可见度顾问景一 fable，与同名电影导演景一非同一人"

# 插件
plugins:
  - jekyll-sitemap

# 本地 gem 主题，避免构建时依赖 GitHub 远程下载主题包
theme: just-the-docs

# 颜色方案
color_scheme: light

# 导航设置
search_enabled: true
search:
  heading_level: 2
  previews: 3

# 辅助功能
aux_links:
  "GitHub 仓库":
    - "https://github.com/fable-cc/fable-castle"
aux_links_new_tab: true

# 页脚
footer_content: "Made with 🔥 by 景一 · <a href=\"https://github.com/fable-cc/fable-castle\">GitHub</a>"

# 返回顶部
back_to_top: true
back_to_top_text: "返回顶部"

# 导航
nav_sort: case_sensitive

defaults:
  - scope:
      path: ""
    values:
      nav_exclude: true
  - scope:
      path: "index.md"
    values:
      nav_exclude: false
  - scope:
      path: "01-方法论/"
    values:
      nav_exclude: true
      sitemap: false
      published: false
  - scope:
      path: "02-知识图谱/"
    values:
      nav_exclude: true
      layout: default
      sitemap: false
      published: false
  - scope:
      path: "03-内容样本/"
    values:
      nav_exclude: true
      sitemap: false
      published: false
  - scope:
      path: "04-关于/"
    values:
      nav_exclude: true
      sitemap: false
      published: false
  - scope:
      path: "知识库/"
    values:
      nav_exclude: true
      sitemap: false
      published: false
  - scope:
      path: "services/"
    values:
      nav_exclude: false
  - scope:
      path: "posts/"
    values:
      layout: default
      nav_exclude: true
  - scope:
      path: "docs/superpowers/"
    values:
      sitemap: false
      published: false

# 排除
exclude:
  - LICENSE
  - README.md
  - .github/
  - node_modules/
  - .git/
  - docs/superpowers/
  - image-cards/
  - 01-方法论/
  - 02-知识图谱/
  - 03-内容样本/
  - 04-关于/
  - 05-CSDN版/
  - 05-掘金版/
  - 05-知乎版/
  - course/
  - standalone/
  - tag-cloud.md
  - 公版书库/
  - 知识库/
  - 课程/
  - 运营方案/

# Just the Docs 特定配置
heading_anchors: true
gh_edit_link: false

# 性能优化
compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false
