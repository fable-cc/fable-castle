# 每次推送后验证当前生产站点可访问
name: Pages 构建检查

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 等待 workflow 部署
        run: sleep 45
      - name: 检查正式域名核心页面
        run: |
          for path in / /diagnosis/ /cases/ /cases/api-model-baseline-2026-08-13/ /privacy/; do
            STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" "https://fable-castle.com${path}")
            if [ "$STATUS" != "200" ]; then
              echo "❌ https://fable-castle.com${path} returned ${STATUS}"
              exit 1
            fi
            echo "✅ https://fable-castle.com${path} returned 200"
          done
